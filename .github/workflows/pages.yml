name: Refresh feed and publish Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/**'
      - 'sources.json'
      - 'docs/**'

concurrency:
  group: wargaming-hub-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.HUB_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decide whether to collect feeds
        id: collect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" != push ]] || ! git diff --quiet "$BEFORE" HEAD -- .github/workflows/pages.yml scripts/refresh.py sources.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh public feeds
        if: steps.collect.outputs.enabled == 'true'
        run: python scripts/refresh.py
      - name: Validate snapshots
        run: |
          node --check docs/assets/app.js
          python scripts/validate_snapshots.py
      - name: Persist feed history
        if: steps.collect.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public wargaming feeds'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v6
        if: github.event_name == 'push'
      - name: Verify the public AI Discover edition
        if: github.event_name == 'push'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
                "${SITE_URL%/}/assets/ai-discover.json?commit=${GITHUB_SHA}&attempt=${attempt}" \
                --output "${RUNNER_TEMP}/live-ai-discover.json" &&
              cmp -s docs/assets/ai-discover.json "${RUNNER_TEMP}/live-ai-discover.json"; then
              exit 0
            fi
            sleep 5
          done
          echo "The public AI Discover JSON did not match the deployed commit."
          exit 1
      - name: Report production result on the commit
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="AI Discover / production" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
