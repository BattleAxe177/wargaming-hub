name: Refresh feed and publish Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/**'
      - 'sources.json'
      - 'docs/**'

concurrency:
  group: wargaming-hub-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.HUB_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decide whether to collect feeds
        id: collect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" != push ]] || ! git diff --quiet "$BEFORE" HEAD -- .github/workflows/pages.yml scripts/refresh.py sources.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh public feeds
        if: steps.collect.outputs.enabled == 'true'
        run: python scripts/refresh.py
      - name: Validate snapshots
        run: |
          node --check docs/assets/app.js
          python scripts/validate_snapshots.py
      - name: Persist feed history
        if: steps.collect.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/feed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public wargaming feeds'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
